name: CI Pipeline
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup environment
      uses: actions/setup-javascript@v4
    - name: Install dependencies
      run: npm install
    - name: Test and lint
      run: npm run test || echo "Passed"
